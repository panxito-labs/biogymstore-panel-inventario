<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Iniciar sesión | BioGymStore</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link href="vendor/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">

  <!-- VISTA 1: INICIO DE SESIÓN (diseño original) -->
  <main class="login-wrap">
    <div class="app-container">
      <header class="brand">
        <div class="logo-container">
          <img src="img/logo.png" alt="BioGym Store" class="brand-logo-img login-logo">
        </div>
        <p class="brand-subtitle">PANEL INTERNO DE INVENTARIO</p>
      </header>

      <div class="restricted-notice">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Demostración académica · datos de prueba
      </div>

      <form id="loginForm" novalidate>
        <div class="input-group">
          <label for="username">USUARIO</label>
          <input type="email" id="username" name="username" placeholder="demo@biogym.cl" required autocomplete="username">
        </div>

        <div class="input-group">
          <label for="password">CONTRASEÑA</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit">Ingresar al panel</button>
      </form>

      <p class="text-center text-secondary small mt-3 mb-0">Demostración: usuario <code>demo@biogym.cl</code> · contraseña <code>demo1234</code></p>

      <footer class="forgot-password">
        <a href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña? Contacta al administrador.</a>
      </footer>
    </div>
  </main>

  <script src="vendor/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
